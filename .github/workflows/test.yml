name: Version 7 camera translation stability tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .[dev]
      - run: pytest -q
      - run: node --check web/app.js
      - run: node --check web/experiments.js
      - run: node --check web/dense_depth.js
      - run: node --check web/depth_eval.js
      - run: node --check web/stabilization.js
      - run: node --check web/visual_frontend.js
      - run: node --check web/range_frontend.js
      - run: python scripts/export_demo.py
      - run: python scripts/evaluate_camera_translation.py
      - uses: actions/upload-artifact@v4
        with:
          name: version7-camera-translation-data
          path: |
            web/data/demo.json
            web/data/translation_eval.json
            web/data/camera_translation_eval.json
